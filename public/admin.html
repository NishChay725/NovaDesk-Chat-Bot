<!-- Widget Embed Code Generator Card -->
<div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
  <h2 class="text-sm font-semibold text-slate-200">Generate Client Embed Script</h2>
  <p class="text-xs text-slate-400">Copy-paste this script tag into any HTML website to deploy NovaDesk instantly.</p>
  
  <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 flex justify-between items-center">
    <code class="text-xs text-emerald-400 font-mono overflow-x-auto">
      &lt;script src="http://localhost:5000/widget.js" data-bot-name="NovaDesk Support" data-color="#2563eb" defer&gt;&lt;/script&gt;
    </code>
    <button 
      onclick="navigator.clipboard.writeText('<script src=\'http://localhost:5000/widget.js\' data-bot-name=\'NovaDesk Support\' data-color=\'#2563eb\' defer></script>'); alert('Copied to clipboard!');" 
      class="ml-4 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded font-medium transition">
      Copy Script
    </button>
  </div>
</div>
